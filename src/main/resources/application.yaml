spring:
  application:
    name: jb

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include:
          - health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

auth:
  google-client-id: ${GOOGLE_CLIENT_ID}
  access-token-secret: ${AUTH_ACCESS_TOKEN_SECRET}
  refresh-token-secret: ${AUTH_REFRESH_TOKEN_SECRET}
  cookie-secure: ${AUTH_COOKIE_SECURE:true}
  allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:3000}

vworld:
  api-key: ${VWORLD_API_KEY}

llm:
  api-key: ${OPENROUTER_API_KEY}
  model: ${LLM_MODEL}
