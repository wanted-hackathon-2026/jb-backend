services:
  app:
    # 배포 워크플로우가 커밋 SHA를 넘김. 서버에서 수동 실행할 땐 latest로 폴백.
    image: ${APP_IMAGE:-ghcr.io/wanted-hackathon-2026/jb-backend:latest}
    volumes:
      - ./data/safety:/app/data/safety:ro
      - ./data/noise:/app/data/noise:ro
      - ./data/infrastructure:/app/data/infrastructure:ro
      - ./data/property-images:/app/data/property-images
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET}
      AUTH_REFRESH_TOKEN_SECRET: ${AUTH_REFRESH_TOKEN_SECRET}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS}
      VWORLD_API_KEY: ${VWORLD_API_KEY}
      SAFETY_CSV_DIRECTORY: /app/data/safety
      SEOUL_OPEN_API_KEY: ${SEOUL_OPEN_API_KEY}
      SDOT_SENSOR_FILE: /app/data/noise/sensors.csv
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      BUS_STOP_FILE: /app/data/infrastructure/bus-stops.csv
      PROPERTY_IMAGE_DIRECTORY: /app/data/property-images
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    ports:
      - "80:8080"
    mem_limit: 1g
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    # SSH 터널 전용. 루프백 바인딩이라 외부에서 직접 접근 불가.
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: jb
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PW}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
